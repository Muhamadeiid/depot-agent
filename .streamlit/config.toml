# Streamlit theme — follows the OS/browser dark/light preference. The [theme]
# defaults apply to whichever mode the browser picks; the [theme.dark] and
# [theme.light] sections override individual colours for each mode so the dark
# variant reads as a soft navy instead of pure black.

[theme]
primaryColor = "#4FC3F7"
font = "sans serif"

[theme.dark]
backgroundColor = "#1B2536"
secondaryBackgroundColor = "#243449"
textColor = "#E6EDF3"
primaryColor = "#4FC3F7"

[theme.light]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#1F2937"
primaryColor = "#1976D2"
